name: fetch-google-trends

on:
  schedule:
    # UTC 00:50 = 北京时间 08:50
    - cron: "50 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Google Trends RSS
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p data
          DATE=$(TZ=Asia/Shanghai date +%F)
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          ok=0
          # Google Trends 不提供 geo=CN，中文热搜用 HK / TW / SG
          for GEO in HK US; do
            out="data/${GEO}-${DATE}.xml"
            code=$(curl -sS -L --max-time 40 --retry 2 --retry-delay 5 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
              -H "Accept: application/rss+xml,application/xml" \
              -w '%{http_code}' -o "$out" \
              "https://trends.google.com/trending/rss?geo=${GEO}") || code=000
            echo "${GEO}: HTTP ${code}, $(wc -c < "$out" 2>/dev/null || echo 0) bytes"
            if [ "$code" = "200" ] && grep -q "<item>" "$out" 2>/dev/null; then
              cp "$out" "data/latest-${GEO,,}.xml"
              ok=1
            else
              rm -f "$out"
            fi
          done
          if [ "$ok" = "0" ]; then
            echo "::error::所有地区抓取失败"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install --quiet requests

      # 精确相对热度曲线（0-100）：内联 Python，失败原因写入 data/iot/debug.log
      - name: Fetch interest-over-time
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, os, random, re, sys, time
          from datetime import datetime, timezone
          import xml.etree.ElementTree as ET
          import requests

          BASE = "https://trends.google.com/trends/api"
          TZ = "-480"
          H = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": "https://trends.google.com/",
              "Origin": "https://trends.google.com",
          }
          NS = {"ht": "https://trends.google.com/trending/rss"}
          LOG = []

          def say(msg):
              print(msg, flush=True)
              LOG.append(str(msg))

          def clean(t):
              i = t.find("{")
              return t[i:] if i >= 0 else t

          def get(s, url, params, label, tries=2):
              for i in range(1, tries + 1):
                  try:
                      r = s.get(url, params=params, headers=H, timeout=30)
                  except Exception as e:
                      say("%s 网络异常: %s" % (label, e))
                      time.sleep(5 * i)
                      continue
                  if r.status_code == 200:
                      try:
                          return json.loads(clean(r.text))
                      except Exception:
                          say("%s JSON 解析失败: %r" % (label, r.text[:200]))
                          return None
                  if r.status_code == 429:
                      say("%s HTTP 429 限流，等 45s 重试" % label)
                      time.sleep(45)
                      continue
                  say("%s HTTP %s: %r" % (label, r.status_code, r.text[:300]))
                  return None
              say("%s 重试次数用尽" % label)
              return None

          def top_keywords(path, n):
              out = []
              for item in ET.parse(path).getroot().iter("item"):
                  t = (item.findtext("title") or "").strip()
                  tr = item.findtext("ht:approx_traffic", default="", namespaces=NS) or ""
                  if t:
                      out.append((int(re.sub(r"[^0-9]", "", tr) or 0), t))
              out.sort(key=lambda x: -x[0])
              return [t for _, t in out[:n]]

          def curve(s, kw, geo, tf):
              payload = {"comparisonItem": [{"keyword": kw, "geo": geo, "time": tf}], "category": 0, "property": ""}
              ex = get(s, BASE + "/explore",
                      {"hl": "en-US", "tz": TZ, "req": json.dumps(payload, separators=(",", ":"))},
                      "explore[%s]" % kw)
              if not ex:
                  return []
              ids = [w.get("id") for w in ex.get("widgets", [])]
              say("explore[%s] widgets=%s" % (kw, ids))
              w = next((x for x in ex.get("widgets", []) if x.get("id") == "TIMESERIES"), None)
              if not w:
                  return []
              d = get(s, BASE + "/widgetdata/multiline",
                      {"hl": "en-US", "tz": TZ,
                       "req": json.dumps(w["request"], separators=(",", ":")),
                       "token": w["token"]},
                      "multiline[%s]" % kw)
              if not d:
                  return []
              rows = []
              for p in d.get("default", {}).get("timelineData", []):
                  hd = p.get("hasData")
                  if hd and not any(hd):
                      continue
                  v = (p.get("value") or [None])[0]
                  if v is None:
                      continue
                  ts = p.get("time")
                  rows.append({
                      "keyword": kw, "geo": geo, "timeframe": tf,
                      "point_time": datetime.fromtimestamp(int(ts), tz=timezone.utc).isoformat() if ts else "",
                      "formatted_time": p.get("formattedTime", ""), "value": int(v)})
              return rows

          os.makedirs("data/iot", exist_ok=True)
          today = datetime.now(timezone.utc).astimezone().strftime("%Y-%m-%d")
          fields = ["keyword", "geo", "timeframe", "point_time", "formatted_time", "value"]
          s = requests.Session()

          # 先访问一次首页，让 session 带上 NID cookie，降低被 429 的概率
          try:
              warm = s.get("https://trends.google.com/?geo=US", headers=H, timeout=30)
              say("预热首页 HTTP %s，cookies=%s" % (warm.status_code, list(s.cookies.keys())))
          except Exception as e:
              say("预热失败: %s" % e)

          total = 0
          for geo, rss in (("HK", "data/latest-hk.xml"), ("US", "data/latest-us.xml")):
              if not os.path.exists(rss):
                  say("跳过 %s：找不到 %s" % (geo, rss))
                  continue
              kws = top_keywords(rss, 4)
              say("%s 关键词: %s" % (geo, kws))
              rows = []
              for i, kw in enumerate(kws):
                  if i:
                      time.sleep(8 + random.uniform(0, 4))
                  try:
                      got = curve(s, kw, geo, "now 7-d")
                  except Exception as e:
                      say("FAIL %s: %s" % (kw, e))
                      continue
                  if got:
                      rows += got
                      say("OK %s: %d 点, 峰值 %d" % (kw, len(got), max(r["value"] for r in got)))
                  else:
                      say("FAIL %s: 无数据点" % kw)
              if not rows:
                  say("%s 没有数据，跳过写出" % geo)
                  continue
              for p in ("data/iot/%s-%s.csv" % (geo, today), "data/iot/latest-%s.csv" % geo.lower()):
                  with open(p, "w", newline="", encoding="utf-8") as f:
                      w = csv.DictWriter(f, fieldnames=fields)
                      w.writeheader()
                      w.writerows(rows)
                  say("写出 %s (%d 行)" % (p, len(rows)))
              total += len(rows)

          say("完成，共 %d 行" % total)
          with open("data/iot/debug.log", "w", encoding="utf-8") as fh:
              fh.write("\n".join(LOG) + "\n")
          sys.exit(0 if total else 1)
          PY

      - name: Prune old snapshots (keep 90 days)
        shell: bash
        run: |
          find data -name '*-*.xml' -mtime +90 -delete || true
          find data/iot -name '*-*.csv' -mtime +90 -delete 2>/dev/null || true
          ls -la data
          ls -la data/iot 2>/dev/null || true

      - name: Commit and push
        shell: bash
        run: |
          git config user.name  "trends-bot"
          git config user.email "trends-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "trends: ${DATE} snapshot"
            git push
          fi
